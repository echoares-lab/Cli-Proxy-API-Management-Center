name: SBOM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-package-lock
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file management-center-node.cdx.json --output-format JSON
      - uses: actions/upload-artifact@v4
        with:
          name: management-center-sbom
          path: management-center-node.cdx.json
